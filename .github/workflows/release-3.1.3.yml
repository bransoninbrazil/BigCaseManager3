name: Publish BigCaseManager3 3.1.3
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions: {}
concurrency: publish-bigcase-manager-three-3-1-3

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish and verify the three installation files
        shell: bash
        run: |
          set -euo pipefail
          version=3.1.3
          assets=(manifest.json main.js styles.css)
          for file in "${assets[@]}"; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GH_REPO/contents/$file?ref=$GITHUB_SHA" > "$file"
            test -s "$file"
          done
          jq -e --arg version "$version" \
            '.version == $version and .id == "bigcase-manager-three"' manifest.json > /dev/null

          if ! gh release view "$version" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$version" "${assets[@]}" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" --title "BigCaseManager3 $version" \
              --notes "公开安装包。在空白笔记库中启用后，可自行建立事项和人员。"
          fi

          mkdir downloaded
          gh release download "$version" --repo "$GH_REPO" --dir downloaded \
            --pattern manifest.json --pattern main.js --pattern styles.css
          for file in "${assets[@]}"; do
            cmp "$file" "downloaded/$file"
          done
